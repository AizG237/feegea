services:
  - type: web
    name: feegea
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FEEGEA_MODEL
        value: claude-opus-5-5
      - key: FEEGEA_EFFORT
        value: low
      - key: FEEGEA_RATE_LIMIT
        value: "30"
